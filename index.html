<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tiny Fireflies</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
           background: #0d1424; color: #f4ecd0; font-family: Georgia, serif; text-align: center; }
    h1 { font-size: clamp(2rem, 6vw, 3.5rem); margin: 0 0 .5rem; }
    p { opacity: .8; }
    .glow { color: #ffe27a; text-shadow: 0 0 12px #ffd23f; }
  </style>
</head>
<body>
  <main>
    <h1>Tiny Fireflies <span class="glow">✦</span></h1>
    <p>Something small and bright is on its way.</p>
  </main>
</body>
</html>
